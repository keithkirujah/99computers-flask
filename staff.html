<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff management | 99 COMPUTERS</title><link rel="stylesheet" href="/nova.css"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{padding:28px;max-width:1100px;margin:auto}.wrap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{grid-column:span 12;padding:22px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.fld{display:grid;gap:6px;flex:1;min-width:170px}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}button{cursor:pointer}.notice{padding:12px;border-radius:12px;margin:12px 0}.bad{color:#ff8b8b}.good{color:#58d6aa}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}@media(max-width:650px){body{padding:12px}table{font-size:13px}th,td{padding:8px}}</style></head><body><header class="hd"><div><h1>Staff management</h1><p class="hint">99 COMPUTERS · secure account administration</p></div><a class="btn" href="/admin.html#users">Back to console</a></header><main class="wrap"><section class="glass card"><h2>Create staff account</h2><p class="hint">Passwords must be at least 12 characters. Passwords are hashed server-side.</p><div id="msg" aria-live="polite"></div><form id="create" class="row"><label class="fld">Username<input name="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9._-]+" autocomplete="off"></label><label class="fld">Temporary password<input name="password" required minlength="12" type="password" autocomplete="new-password"></label><label class="fld">Role<select name="role"><option value="staff">Staff</option><option value="site">Site owner</option><option value="admin">Administrator</option></select></label><button class="btn p" type="submit">Create account</button></form></section><section class="glass card"><div class="hd"><h2>Existing accounts</h2><button id="refresh" class="btn" type="button">Refresh</button></div><div id="accounts">Loading accounts…</div></section></main><script>
const $=s=>document.querySelector(s), msg=(t,ok=false)=>{$('#msg').className='notice '+(ok?'good':'bad');$('#msg').textContent=t};
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{const j=await api('/api/users');$('#accounts').innerHTML='<table><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+j.users.map(u=>`<tr><td>${esc(u.username)}</td><td><select data-role="${u.id}"><option ${u.role==='staff'?'selected':''} value="staff">Staff</option><option ${u.role==='site'?'selected':''} value="site">Site owner</option><option ${u.role==='admin'?'selected':''} value="admin">Admin</option></select></td><td>${u.active?'Active':'Disabled'}</td><td><button class="btn sm" data-toggle="${u.id}" data-active="${u.active?'false':'true'}">${u.active?'Disable':'Enable'}</button> <button class="btn sm" data-reset="${u.id}">Reset password</button> <button class="btn sm" data-delete="${u.id}">Delete</button></td></tr>`).join('')+'</tbody></table>'}catch(e){$('#accounts').textContent=e.message+' — sign in as an administrator first.'}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#create').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/api/users',{method:'POST',body:JSON.stringify(d)});e.target.reset();msg('Account created successfully. Save the temporary password securely and share it privately.',true);load()}catch(err){msg(err.message)}});
$('#refresh').addEventListener('click',load);$('#accounts').addEventListener('change',async e=>{if(e.target.dataset.role){try{await api('/api/users/'+e.target.dataset.role,{method:'PATCH',body:JSON.stringify({role:e.target.value})});msg('Role updated.',true)}catch(err){msg(err.message);load()}}});$('#accounts').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.toggle)await api('/api/users/'+b.dataset.toggle,{method:'PATCH',body:JSON.stringify({active:b.dataset.active==='true'})});else if(b.dataset.reset){const p=prompt('Enter a new password (minimum 12 characters).');if(!p)return;await api('/api/users/'+b.dataset.reset,{method:'PATCH',body:JSON.stringify({password:p})})}else if(b.dataset.delete){if(!confirm('Permanently delete this account?'))return;await api('/api/users/'+b.dataset.delete,{method:'DELETE'})}msg('Account updated.',true);load()}catch(err){msg(err.message)}});load();
</script></body></html>
